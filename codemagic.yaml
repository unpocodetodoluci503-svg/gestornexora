              <aapt:attr name="android:fillColor">
                <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:type="linear">
                  <item android:offset="0" android:color="#FF070B18"/>
                  <item android:offset="1" android:color="#FF1B3FA8"/>
                </gradient>
              </aapt:attr>
            </path>
          </vector>
          EOF
          cat > src/main/res/drawable/ic_fg.xml <<'EOF'

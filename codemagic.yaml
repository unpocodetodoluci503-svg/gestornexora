workflows:
  apk:
    name: Mis archivos APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Armar proyecto
        script: |
          mkdir -p src/main/kotlin/com/gestor/archivos
          cp MainActivity.kt src/main/kotlin/com/gestor/archivos/
          cp AndroidManifest.xml src/main/
      - name: Compilar APK
        script: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle assembleDebug --no-daemon
    artifacts:
      - build/outputs/apk/debug/*.apk
